<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Pear Phone</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #ffffff;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            font-family: Arial, Helvetica, sans-serif;
        }

        #phoneArea {
            position: relative;
            width: min(92vh, 92vw);
            height: min(92vh, 92vw);
            flex-shrink: 0;
            transform: rotate(90deg) scale(1.28);
            transform-origin: center center;
            touch-action: none;
        }

        #phoneImage {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;
        }

        .appButton {
            position: absolute;
            border: none;
            padding: 0;
            margin: 0;
            background: transparent;
            z-index: 50;
            cursor: pointer;
            touch-action: manipulation;
        }

        .appButton:active {
            background: rgba(255, 255, 255, 0.20);
            border-radius: 50%;
        }

        #pearHomeButton {
            position: absolute;
            left: 42%;
            top: 76%;
            width: 16%;
            height: 10%;
            border: none;
            background: transparent;
            z-index: 300;
            cursor: pointer;
            touch-action: manipulation;
        }

        #appWindow {
            position: absolute;
            left: 32%;
            top: 30%;
            width: 36%;
            height: 40%;
            z-index: 200;
            display: none;
            overflow: hidden;
            background: #f4f4f4;
            border: 2px solid #222;
            border-radius: 13px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55);
            font-family: Arial, Helvetica, sans-serif;
        }

        #appWindow.open {
            display: flex;
            flex-direction: column;
        }

        #appHeader {
            height: 34px;
            min-height: 34px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7px;
            background: linear-gradient(#f8f8f8, #cfcfcf);
            border-bottom: 1px solid #888;
            color: #111;
            font-weight: bold;
        }

        #appTitle {
            font-size: 12px;
        }

        #closeApp {
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 50%;
            background: #050505;
            color: white;
            font-size: 14px;
            line-height: 24px;
            padding: 0;
            cursor: pointer;
        }

        #appContent {
            flex: 1;
            min-height: 0;
            overflow: auto;
            padding: 8px;
            background: #f5f5f5;
            color: #111;
            font-size: 11px;
            touch-action: auto;
        }

        .appButtonLarge {
            width: 100%;
            min-height: 30px;
            margin: 4px 0;
            border: none;
            border-radius: 7px;
            background: #168cff;
            color: white;
            font-size: 11px;
            cursor: pointer;
        }

        .appInput {
            width: 100%;
            min-height: 30px;
            padding: 5px;
            margin-bottom: 5px;
            border: 1px solid #999;
            border-radius: 6px;
            font-size: 11px;
        }

        .appTextarea {
            width: 100%;
            height: 55px;
            padding: 5px;
            border: 1px solid #999;
            border-radius: 6px;
            font-size: 11px;
            resize: none;
        }

        .card {
            background: white;
            border: 1px solid #ccc;
            border-radius: 7px;
            padding: 7px;
            margin-bottom: 5px;
        }

        .photoGrid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }

        .photo {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            background: linear-gradient(135deg, #66ccff, #ff99cc);
            font-size: 20px;
        }

        /* REAL VIDEO PLAYER */

        #samCatVideo {
            display: block;
            width: 100%;
            max-height: 180px;
            background: #000;
            border-radius: 7px;
            margin: 5px 0;
        }

        /* KEYBOARD INSIDE APP WINDOW */

        #pearKeyboard {
            position: relative;
            width: 100%;
            flex-shrink: 0;
            display: none;
            padding: 5px;
            background: #202020;
            border-top: 2px solid #000;
            touch-action: manipulation;
        }

        #pearKeyboard.open {
            display: block;
        }

        .keyboardRow {
            display: flex;
            gap: 3px;
            margin-bottom: 3px;
        }

        .keyboardRow:last-child {
            margin-bottom: 0;
        }

        .key {
            flex: 1;
            min-width: 0;
            height: 25px;
            padding: 0;
            border: 1px solid #777;
            border-radius: 4px;
            background: linear-gradient(#eeeeee, #bdbdbd);
            color: #111;
            font-size: 9px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }

        .key:active {
            background: #888;
            color: white;
        }

        .key.space {
            flex: 4;
        }

        .key.enter {
            flex: 2;
        }

        .key.backspace {
            flex: 1.5;
        }

        /* THE SLAP TEXT BAR */

        .pearTypingBar {
            width: 100%;
            min-height: 30px;
            padding: 6px 8px;
            border: 1px solid #777;
            border-radius: 6px;
            background: white;
            color: #111;
            font-size: 11px;
            margin-bottom: 5px;
            overflow: hidden;
            white-space: nowrap;
        }

        .pearTypingBar.placeholder {
            color: #777;
        }

        #slapTypingArea {
            position: relative;
            width: 100%;
            display: none;
            padding: 4px;
        }

        #slapTypingArea.open {
            display: block;
        }

        #slapTextBar {
            width: 100%;
            min-height: 34px;
            border: 2px solid #222;
            border-radius: 7px;
            background: rgba(255, 255, 255, 0.96);
            padding: 7px;
            font-size: 12px;
            color: #111;
            overflow: hidden;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div id="phoneArea">

        <img
            id="phoneImage"
            src="pearphone.png"
            alt="Pear Phone"
            draggable="false"
        >

        <button
            id="pearHomeButton"
            type="button"
            aria-label="Pear Phone Home"
        ></button>

        <div id="slapTypingArea">
            <div
                id="slapTextBar"
                class="pearTypingBar placeholder"
            >
                Tap here to type...
            </div>
        </div>

        <div id="appWindow">

            <div id="appHeader">
                <span id="appTitle">App</span>

                <button
                    id="closeApp"
                    type="button"
                    aria-label="Close app"
                >●</button>
            </div>

            <div id="appContent"></div>

            <div id="pearKeyboard"></div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
