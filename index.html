<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pear Phone</title>

    <style>

        /* =====================================================
           PAGE
           ===================================================== */

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: white;
        }


        body {
            display: flex;

            justify-content: center;

            align-items: center;
        }


        /* =====================================================
           PEAR PHONE IMAGE
           =====================================================

           This is YOUR uploaded pearphone.png.

           It is rotated sideways and zoomed in 25%.

           ===================================================== */

        #phone {

            width: 100vh;

            height: 100vh;

            max-width: none;

            display: block;

            user-select: none;

            -webkit-user-drag: none;

            /*
             * Rotate the entire phone sideways.
             */
            transform: rotate(90deg) scale(1.25);

        }


        /* =====================================================
           APP SCREEN
           ===================================================== */

        #app {

            position: fixed;

            inset: 0;

            display: none;

            background: white;

            z-index: 100;

            font-family: Arial, Helvetica, sans-serif;

            text-align: center;

            align-items: center;

            justify-content: center;

            flex-direction: column;

        }


        #app.open {

            display: flex;

        }


        #app h1 {

            font-size: 45px;

            margin: 0 0 15px 0;

        }


        #app p {

            font-size: 20px;

            margin: 0;

        }


        /* =====================================================
           BACK BUTTON
           ===================================================== */

        #back {

            position: absolute;

            top: 20px;

            left: 20px;

            width: 55px;

            height: 55px;

            border: none;

            border-radius: 50%;

            background: #222;

            color: white;

            font-size: 35px;

            cursor: pointer;

        }

    </style>

</head>


<body>


    <!-- =====================================================
         YOUR ACTUAL UPLOADED PEAR PHONE IMAGE
         ===================================================== -->

    <img

        id="phone"

        src="pearphone.png"

        alt="Pear Phone"

        usemap="#pearPhoneMap"

    >


    <!-- =====================================================
         CLICKABLE AREAS ON THE ACTUAL PICTURE
         ===================================================== -->

    <map name="pearPhoneMap">


        <!-- =========================
             MESSAGES
             ========================= -->

        <area
            shape="circle"
            coords="614,379,55"
            href="#"
            data-app="Messages"
            alt="Messages"
        >


        <!-- =========================
             CAMERA
             ========================= -->

        <area
            shape="circle"
            coords="740,380,55"
            href="#"
            data-app="Camera"
            alt="Camera"
        >


        <!-- =========================
             SOCIAL FAST
             ========================= -->

        <area
            shape="circle"
            coords="535,507,55"
            href="#"
            data-app="Social Fast"
            alt="Social Fast"
        >


        <!-- =========================
             STOCKS
             ========================= -->

        <area
            shape="circle"
            coords="663,516,55"
            href="#"
            data-app="Stocks"
            alt="Stocks"
        >


        <!-- =========================
             MAPS
             ========================= -->

        <area
            shape="circle"
            coords="792,511,55"
            href="#"
            data-app="Maps"
            alt="Maps"
        >


        <!-- =========================
             PHOTOS
             ========================= -->

        <area
            shape="circle"
            coords="534,643,55"
            href="#"
            data-app="Photos"
            alt="Photos"
        >


        <!-- =========================
             WEATHER
             ========================= -->

        <area
            shape="circle"
            coords="664,654,55"
            href="#"
            data-app="Weather"
            alt="Weather"
        >


        <!-- =========================
             NOTES
             ========================= -->

        <area
            shape="circle"
            coords="794,648,55"
            href="#"
            data-app="Notes"
            alt="Notes"
        >


        <!-- =========================
             IPOD TUNES
             ========================= -->

        <area
            shape="circle"
            coords="451,747,55"
            href="#"
            data-app="iPodTunes"
            alt="iPodTunes"
        >


        <!-- =========================
             SETTINGS
             ========================= -->

        <area
            shape="circle"
            coords="585,768,55"
            href="#"
            data-app="Settings"
            alt="Settings"
        >


        <!-- =========================
             CLOCK
             ========================= -->

        <area
            shape="circle"
            coords="707,770,55"
            href="#"
            data-app="Clock"
            alt="Clock"
        >


        <!-- =========================
             VIDEOS
             ========================= -->

        <area
            shape="circle"
            coords="820,755,55"
            href="#"
            data-app="Videos"
            alt="Videos"
        >

    </map>


    <!-- =====================================================
         APP WINDOW
         ===================================================== -->

    <div id="app">


        <button
            id="back"
            type="button"
        >
            ‹
        </button>


        <h1 id="appName"></h1>


        <p id="appText"></p>


    </div>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="app.js"></script>


</body>

</html>
