<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Pear Phone</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: white;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            font-family: Arial, sans-serif;
        }


        /* =====================================================
           PHONE AREA
           ===================================================== */

        #phoneArea {

            position: relative;

            /*
             * The original PNG is square.
             * This gives it a large size.
             */
            width: min(92vh, 92vw);
            height: min(92vh, 92vw);

            flex-shrink: 0;

            /*
             * BOTH the picture and clickable buttons
             * are inside this container.
             */
            transform: rotate(90deg) scale(1.25);

            transform-origin: center center;

            touch-action: none;
        }


        /* =====================================================
           ACTUAL PICTURE
           ===================================================== */

        #phoneImage {

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            display: block;

            object-fit: contain;

            user-select: none;

            -webkit-user-select: none;

            -webkit-user-drag: none;

            pointer-events: none;
        }


        /* =====================================================
           INVISIBLE APP BUTTONS
           ===================================================== */

        .appButton {

            position: absolute;

            border: none;

            padding: 0;

            margin: 0;

            background: transparent;

            cursor: pointer;

            z-index: 50;

            /*
             * Allows touch/click.
             */
            touch-action: manipulation;
        }


        /*
         * TEMPORARY visual feedback.
         * This lets you SEE that the button is actually
         * being clicked while testing.
         *
         * Once everything works, we can remove this.
         */

        .appButton:active {

            background: rgba(255, 255, 255, 0.25);

            border-radius: 50%;
        }


        /* =====================================================
           APP WINDOW
           ===================================================== */

        #appWindow {

            position: absolute;

            /*
             * This is inside the phone.
             */
            left: 25%;
            top: 23%;

            width: 50%;
            height: 52%;

            z-index: 100;

            display: none;

            overflow: hidden;

            background: white;

            border: 3px solid #111;

            border-radius: 18px;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.5);

            /*
             * Undo the phone's rotation so the
             * app itself is readable.
             */
            transform: rotate(-90deg);

            transform-origin: center center;

            font-family: Arial, sans-serif;
        }


        #appWindow.open {

            display: flex;

            flex-direction: column;
        }


        /* =====================================================
           APP HEADER
           ===================================================== */

        #appHeader {

            height: 45px;

            min-height: 45px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 10px;

            background: linear-gradient(
                #eeeeee,
                #cccccc
            );

            border-bottom: 2px solid #888;

            font-weight: bold;
        }


        #appTitle {

            font-size: 17px;
        }


        #closeApp {

            width: 30px;

            height: 30px;

            border: none;

            border-radius: 50%;

            background: #222;

            color: white;

            font-size: 20px;

            cursor: pointer;
        }


        /* =====================================================
           APP CONTENT
           ===================================================== */

        #appContent {

            flex: 1;

            overflow: auto;

            padding: 12px;

            background: #f5f5f5;

            color: #111;

            font-size: 14px;
        }


        .appAction {

            width: 100%;

            min-height: 42px;

            margin: 6px 0;

            border: none;

            border-radius: 9px;

            background: #168cff;

            color: white;

            font-size: 15px;

            cursor: pointer;
        }


        .appInput {

            width: 100%;

            padding: 10px;

            border: 2px solid #aaa;

            border-radius: 8px;

            font-size: 15px;

            margin-bottom: 8px;
        }


        .card {

            background: white;

            border: 1px solid #ccc;

            border-radius: 9px;

            padding: 10px;

            margin-bottom: 8px;
        }


        .photoGrid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 5px;
        }


        .photo {

            aspect-ratio: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 7px;

            background:
                linear-gradient(
                    135deg,
                    #66ccff,
                    #ff99cc
                );

            font-size: 28px;
        }


        .emoji {

            font-size: 28px;

            border: none;

            background: transparent;

            cursor: pointer;
        }


        /* =====================================================
           PAGE INDICATOR
           ===================================================== */

        #pageIndicator {

            position: fixed;

            bottom: 10px;

            left: 50%;

            transform: translateX(-50%);

            padding: 5px 12px;

            background: rgba(0,0,0,.55);

            color: white;

            border-radius: 20px;

            font-size: 12px;

            z-index: 1000;
        }

    </style>

</head>


<body>


    <!-- =====================================================
         EVERYTHING THAT BELONGS TO THE PHONE IS HERE
         ===================================================== -->

    <div id="phoneArea">


        <!-- YOUR ACTUAL IMAGE -->

        <img
            id="phoneImage"
            src="pearphone.png"
            alt="Pear Phone"
            draggable="false"
        >


        <!-- APP BUTTONS ARE CREATED BY app.js -->


        <!-- =================================================
             APP WINDOW
             ================================================= -->

        <div id="appWindow">


            <div id="appHeader">

                <span id="appTitle">
                    App
                </span>


                <button
                    id="closeApp"
                    type="button"
                >
                    ×
                </button>

            </div>


            <div id="appContent"></div>


        </div>


    </div>


    <div id="pageIndicator">
        Page 1
    </div>


    <script src="app.js"></script>

</body>

</html>
