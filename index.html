<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pear Phone</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
            font-family: Arial, sans-serif;
            touch-action: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The picture itself */
        #phone {
            position: relative;
            width: min(92vw, 92vh);
            height: min(92vw, 92vh);
        }

        #phoneImage {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        /* Invisible buttons placed over the picture */
        .app {
            position: absolute;
            border: 0;
            background: transparent;
            padding: 0;
            margin: 0;
            z-index: 10;
            cursor: pointer;
        }

        /* App opened screen */
        #app {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            background: #087fe8;
            color: white;
            text-align: center;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        #app.open {
            display: flex;
        }

        #app h1 {
            font-size: 48px;
            margin: 0 0 15px;
        }

        #app p {
            font-size: 22px;
            margin: 0;
        }

        #back {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 55px;
            height: 55px;
            border: 0;
            border-radius: 50%;
            background: rgba(0,0,0,.65);
            color: white;
            font-size: 35px;
        }
    </style>
</head>

<body>

    <div id="phone">

        <img
            id="phoneImage"
            src="pearphone.png"
            alt="Pear Phone"
        >

    </div>

    <div id="app">

        <button id="back" type="button">‹</button>

        <h1 id="appName"></h1>

        <p id="appDescription"></p>

    </div>

    <script src="app.js"></script>

</body>
</html>
