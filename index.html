<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Pear Phone</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
            touch-action: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Main phone area */
        #phone-container {
            position: relative;

            /* Keeps the phone vertical and large */
            height: 96vh;
            width: min(96vw, 96vh);

            display: flex;
            justify-content: center;
            align-items: center;

            touch-action: none;
        }

        /* THE ACTUAL PICTURE */
        #phone-image {
            position: absolute;

            width: 100%;
            height: 100%;

            object-fit: contain;

            user-select: none;
            -webkit-user-drag: none;

            pointer-events: none;

            /*
             * 15% visual enlargement while keeping
             * the entire phone as the main visual.
             */
            transform: scale(1.15);
        }

        /*
         * Invisible buttons that sit directly
         * over the apps in the picture.
         */
        .app-button {
            position: absolute;

            background: transparent;
            border: none;

            cursor: pointer;

            z-index: 10;

            padding: 0;
        }

        .app-button:active {
            background: rgba(255,255,255,0.12);
            border-radius: 50%;
        }

        /* App screen */
        #app-screen {
            position: fixed;

            inset: 0;

            background: #0788ff;

            display: none;

            z-index: 100;

            color: white;

            font-family: Arial, sans-serif;
        }

        #app-screen.open {
            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;
        }

        #back-button {
            position: absolute;

            top: 20px;
            left: 20px;

            width: 50px;
            height: 50px;

            border: none;
            border-radius: 50%;

            background: rgba(0,0,0,0.65);

            color: white;

            font-size: 32px;

            cursor: pointer;
        }

        #app-title {
            font-size: 42px;
            margin-bottom: 15px;
        }

        #app-description {
            font-size: 20px;
        }

    </style>
</head>

<body>

    <div id="phone-container">

        <!-- THE PICTURE IS THE PHONE -->
        <img
            id="phone-image"
            src="Parphone.png"
            alt="Pear Phone"
        >

    </div>


    <!-- Temporary app screen -->
    <div id="app-screen">

        <button id="back-button">‹</button>

        <h1 id="app-title"></h1>

        <p id="app-description"></p>

    </div>


    <script src="app.js"></script>

</body>
</html>
