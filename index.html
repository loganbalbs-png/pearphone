<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pear Phone</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #phone {
            width: auto;
            height: 100vh;
            max-width: 100vw;

            display: block;

            user-select: none;
            -webkit-user-drag: none;
        }

        #app {
            position: fixed;
            inset: 0;

            display: none;

            background: white;

            z-index: 10;

            font-family: Arial, sans-serif;

            text-align: center;
        }

        #app.open {
            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;
        }

        #app h1 {
            font-size: 45px;
            margin: 0 0 15px;
        }

        #app p {
            font-size: 20px;
        }

        #back {
            position: absolute;

            top: 20px;
            left: 20px;

            width: 55px;
            height: 55px;

            border: none;

            border-radius: 50%;

            background: #222;

            color: white;

            font-size: 35px;

            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- YOUR ACTUAL UPLOADED PICTURE -->
    <img
        id="phone"
        src="pearphone.png"
        alt="Pear Phone"
        usemap="#pearPhoneMap"
    >

    <!-- CLICKABLE AREAS ON THE ACTUAL PICTURE -->
    <map name="pearPhoneMap">

        <!-- Messages -->
        <area
            shape="circle"
            coords="614,379,55"
            href="#"
            data-app="Messages"
            alt="Messages"
        >

        <!-- Camera -->
        <area
            shape="circle"
            coords="740,380,55"
            href="#"
            data-app="Camera"
            alt="Camera"
        >

        <!-- Social Fast -->
        <area
            shape="circle"
            coords="535,507,55"
            href="#"
            data-app="Social Fast"
            alt="Social Fast"
        >

        <!-- Stocks -->
        <area
            shape="circle"
            coords="663,516,55"
            href="#"
            data-app="Stocks"
            alt="Stocks"
        >

        <!-- Maps -->
        <area
            shape="circle"
            coords="792,511,55"
            href="#"
            data-app="Maps"
            alt="Maps"
        >

        <!-- Photos -->
        <area
            shape="circle"
            coords="534,643,55"
            href="#"
            data-app="Photos"
            alt="Photos"
        >

        <!-- Weather -->
        <area
            shape="circle"
            coords="664,654,55"
            href="#"
            data-app="Weather"
            alt="Weather"
        >

        <!-- Notes -->
        <area
            shape="circle"
            coords="794,648,55"
            href="#"
            data-app="Notes"
            alt="Notes"
        >

        <!-- iPodTunes -->
        <area
            shape="circle"
            coords="451,747,55"
            href="#"
            data-app="iPodTunes"
            alt="iPodTunes"
        >

        <!-- Settings -->
        <area
            shape="circle"
            coords="585,768,55"
            href="#"
            data-app="Settings"
            alt="Settings"
        >

        <!-- Clock -->
        <area
            shape="circle"
            coords="707,770,55"
            href="#"
            data-app="Clock"
            alt="Clock"
        >

        <!-- Videos -->
        <area
            shape="circle"
            coords="820,755,55"
            href="#"
            data-app="Videos"
            alt="Videos"
        >

    </map>


    <!-- APP THAT OPENS WHEN AN ICON IS CLICKED -->

    <div id="app">

        <button id="back">‹</button>

        <h1 id="appName"></h1>

        <p id="appText"></p>

    </div>


    <script src="app.js"></script>

</body>
</html>
