<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>Pear Phone</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: none;
        }

        #phone {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        #screen {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        .touch-zone {
            position: absolute;
            border: none;
            background: transparent;
            cursor: pointer;
            z-index: 10;
        }

        .touch-zone:active {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%;
        }

        #appScreen {
            position: absolute;
            inset: 0;
            display: none;
            z-index: 20;
            background: #000;
        }

        #appScreen.active {
            display: block;
        }

        #appContent {
            width: 100%;
            height: 100%;
        }

        #backButton {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 30;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            background: rgba(0, 0, 0, 0.65);
            color: white;
            font-size: 25px;
            cursor: pointer;
        }

        #moodInput {
            width: 70%;
            padding: 15px;
            font-size: 20px;
            border-radius: 10px;
            border: 2px solid #ff4fa3;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

<div id="phone">

    <!-- Main Pear Phone image -->
    <img id="screen" src="Parphone.png" alt="Pear Phone">

    <!-- Interactive app buttons are created by app.js -->

    <!-- Custom app screen -->
    <div id="appScreen">
        <button id="backButton">‹</button>
        <div id="appContent"></div>
    </div>

</div>

<script src="app.js"></script>

</body>
</html>
