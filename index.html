<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Pear Phone</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #ffffff;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =====================================================
           PHONE
           ===================================================== */

        #phoneArea {
            position: relative;

            width: min(92vh, 92vw);
            height: min(92vh, 92vw);

            flex-shrink: 0;

            /*
             * Sideways Pear Phone + zoom
             */
            transform: rotate(90deg) scale(1.28);

            transform-origin: center center;

            touch-action: none;
        }

        /* =====================================================
           YOUR ACTUAL PEAR PHONE IMAGE
           ===================================================== */

        #phoneImage {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;

            pointer-events: none;

            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;
        }

        /* =====================================================
           INVISIBLE CLICKABLE APP AREAS
           ===================================================== */

        .appButton {
            position: absolute;

            border: none;
            padding: 0;
            margin: 0;

            background: transparent;

            z-index: 50;

            cursor: pointer;

            touch-action: manipulation;
        }

        .appButton:active {
            background: rgba(255, 255, 255, 0.20);
            border-radius: 50%;
        }

        /* =====================================================
           SMALL APP TAB
           ===================================================== */

        #appWindow {
            position: absolute;

            left: 32%;
            top: 30%;

            width: 36%;
            height: 40%;

            z-index: 200;

            display: none;

            overflow: hidden;

            background: #f4f4f4;

            border: 2px solid #222;

            border-radius: 13px;

            box-shadow:
                0 6px 18px rgba(0, 0, 0, 0.55);

            font-family: Arial, Helvetica, sans-serif;
        }

        #appWindow.open {
            display: flex;
            flex-direction: column;
        }

        /* =====================================================
           APP HEADER
           ===================================================== */

        #appHeader {
            height: 34px;
            min-height: 34px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7px;

            background: linear-gradient(
                #f8f8f8,
                #cfcfcf
            );

            border-bottom: 1px solid #888;

            color: #111;

            font-weight: bold;
        }

        #appTitle {
            font-size: 12px;
        }

        /* =====================================================
           BLACK PEAR BUTTON
           ===================================================== */

        #closeApp {
            width: 24px;
            height: 24px;

            border: none;

            border-radius: 50%;

            background: #050505;

            color: white;

            font-size: 14px;

            line-height: 24px;

            padding: 0;

            cursor: pointer;
        }

        /* =====================================================
           APP CONTENT
           ===================================================== */

        #appContent {
            flex: 1;

            overflow: auto;

            padding: 8px;

            background: #f5f5f5;

            color: #111;

            font-size: 11px;

            touch-action: auto;
        }

        .appButtonLarge {
            width: 100%;

            min-height: 30px;

            margin: 4px 0;

            border: none;

            border-radius: 7px;

            background: #168cff;

            color: white;

            font-size: 11px;

            cursor: pointer;
        }

        .appInput {
            width: 100%;

            min-height: 30px;

            padding: 5px;

            margin-bottom: 5px;

            border: 1px solid #999;

            border-radius: 6px;

            font-size: 11px;
        }

        .appTextarea {
            width: 100%;

            height: 55px;

            padding: 5px;

            border: 1px solid #999;

            border-radius: 6px;

            font-size: 11px;

            resize: none;
        }

        .card {
            background: white;

            border: 1px solid #ccc;

            border-radius: 7px;

            padding: 7px;

            margin-bottom: 5px;
        }

        .photoGrid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 4px;
        }

        .photo {
            aspect-ratio: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 5px;

            background:
                linear-gradient(
                    135deg,
                    #66ccff,
                    #ff99cc
                );

            font-size: 20px;
        }

    </style>
</head>

<body>

    <!-- =====================================================
         PEAR PHONE
         ===================================================== -->

    <div id="phoneArea">

        <!-- YOUR ACTUAL IMAGE -->

        <img
            id="phoneImage"
            src="pearphone.png"
            alt="Pear Phone"
            draggable="false"
        >


        <!-- APP TAB -->

        <div id="appWindow">

            <div id="appHeader">

                <span id="appTitle">
                    App
                </span>

                <!-- BLACK BUTTON TO EXIT APP -->

                <button
                    id="closeApp"
                    type="button"
                    aria-label="Close app"
                >
                    ●
                </button>

            </div>

            <div id="appContent"></div>

        </div>

    </div>


    <script src="app.js"></script>

</body>
</html>
