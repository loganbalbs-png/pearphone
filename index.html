<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
          maximum-scale=1.0, user-scalable=no">

    <title>Pear Phone</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
            touch-action: none;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /*
         * This is the actual phone picture.
         * It stays vertical, centered and large.
         */
        #phone {
            position: relative;

            width: min(90vw, 83vh);
            height: min(90vw, 83vh);

            flex-shrink: 0;

            touch-action: none;
        }

        #phoneImage {
            position: absolute;

            width: 100%;
            height: 100%;

            object-fit: contain;

            transform: scale(1.15);

            user-select: none;
            -webkit-user-drag: none;

            pointer-events: none;
        }

        /*
         * Invisible clickable areas.
         * These sit directly ON TOP of the apps
         * in the picture.
         */
        .appButton {
            position: absolute;

            border: 0;
            padding: 0;
            margin: 0;

            background: transparent;

            z-index: 5;

            cursor: pointer;

            touch-action: manipulation;
        }

        /*
         * App screen
         */
        #appScreen {
            position: fixed;
            inset: 0;

            z-index: 100;

            display: none;

            background: #087ee8;

            color: white;

            font-family: Arial, sans-serif;

            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        #appScreen.open {
            display: flex;
        }

        #appTitle {
            font-size: 42px;
            margin: 0 0 10px;
        }

        #appText {
            font-size: 20px;
        }

        #backButton {
            position: absolute;

            top: 20px;
            left: 20px;

            width: 52px;
            height: 52px;

            border: 0;
            border-radius: 50%;

            background: rgba(0, 0, 0, 0.65);

            color: white;

            font-size: 34px;

            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="phone">

        <!-- THIS IS THE ACTUAL PEAR PHONE PICTURE -->
        <img
            id="phoneImage"
            src="pearphone.png"
            alt="Pear Phone"
        >

    </div>


    <div id="appScreen">

        <button id="backButton">‹</button>

        <h1 id="appTitle"></h1>

        <div id="appText"></div>

    </div>


    <script src="app.js"></script>

</body>
</html>
